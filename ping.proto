syntax = "proto3";
package proto;

// Edition names the split-tunnel whitelist a client holds: which
// country's list, which Hub version of it, and how many of its
// prefixes have arrived so far. The Node pages the rest from `count`.
message Edition {
  // ISO 3166-1 alpha-2 country the held list is for ("RU"). Empty
  // means the client holds no list at all.
  string country = 1;

  // Version stamped on the list by the Hub, opaque to the client and
  // compared for equality only. Zero means no list is held.
  uint64 version = 2;

  // Number of prefixes of that version received so far, in list
  // order. Zero means none has arrived yet, so the Node starts from
  // the first page.
  uint32 count = 3;
}

// Gesture is one interaction a person had with the app's own
// interface: a tap on a named control, how long before this Ping it
// happened, and a short detail saying what the tap was about. Clients
// record gestures silently and report them here, so that the Hub can
// learn which parts of the interface people actually use.
message Gesture {
  // Name of the control that was touched, in dotted form
  // ("intent.on", "server.pick", "prefs.turn"), drawn from a closed
  // vocabulary the clients share. At most 32 bytes of printable ASCII.
  // The Node MUST discard a gesture whose name is empty, longer than
  // that, or carries a byte outside that range.
  string name = 1;

  // How long before this Ping was prepared the interaction happened,
  // in milliseconds. The Node subtracts it from its own clock to date
  // the gesture, so that a client whose clock is wrong or dishonest
  // cannot misplace the gesture in time. Zero means "just now", which
  // is a valid reading and MUST be recorded.
  uint32 age = 2;

  // What the interaction was about, when the name alone does not say
  // it: a country code ("NL"), an offer identifier, or a knob and its
  // new position ("reconnect=on"). At most 64 bytes of printable
  // ASCII, and never text a person typed. Empty means the name says
  // everything, which is the common case.
  string detail = 3;
}

// Ping is sent by the client at a regular interval (a few seconds)
// to keep the tunnel alive, drive RTT measurement, and piggyback
// reachability reports about peer Nodes. The Node answers each Ping
// with a Pong.
message Ping {
  // Client clock at the moment the Ping was prepared, in
  // milliseconds since the Unix epoch. The Node echoes it back in
  // Pong.timestamp so that the client can compute round-trip time
  // without keeping per-request state.
  uint64 timestamp = 1;

  // Per-peer probe-failure counters accumulated since the previous
  // Ping. The key is the peer Node's IPv4 address in dotted form
  // ("203.0.113.7"); the value is the number of probes that failed
  // (timeouts, refusals, etc.). Forwarded to the Hub so that
  // unreachable Nodes can be retired. MUST NOT contain more entries
  // than the fleet size (dozens); the Node SHOULD discard or
  // truncate a Ping whose canaries map exceeds that bound to prevent
  // unbounded map allocation per session. When producing keys from
  // Peer.ip (four raw bytes, network byte order), the client MUST
  // convert each byte to its decimal representation and join with
  // dots before inserting into this map.
  map<string, uint32> canaries = 2;

  // Round-trip time of the previous Ping/Pong exchange, in
  // milliseconds, measured by the client. Zero means "no measurement
  // yet" (e.g. the first Ping of a session before any Pong has
  // arrived); the Node MUST ignore a zero and not record it. The Node
  // buckets non-zero values into a fixed histogram and reports the
  // per-client average RTT to the Hub with usage data.
  uint32 rtt = 3;

  // Field 15 carries random padding that every client appends after
  // the serialized message (see Padding in the clients); it MUST stay
  // reserved so that no real field ever collides with those bytes.
  reserved 15;

  // How much of its country whitelist — the address prefixes routed
  // around the tunnel — the client holds, so the Node can send only
  // the pages it misses (see Pong.whitelist). Present on every Ping
  // while split tunneling is on, all zero until the first page lands.
  // Absent when the client predates this field or keeps split
  // tunneling off, and then the Node MUST NOT send Pong.whitelist.
  Edition whitelist = 4;

  // Interactions the person had with the app's interface since the
  // previous report, oldest first. A client MUST NOT put more than
  // eight of them in one Ping: the Node drops a frame above its
  // 2048-byte ceiling outright instead of truncating it, so an
  // overlong Ping is lost together with everything else it carried. A
  // client holding more SHOULD send eight here and keep the rest for
  // the Pings that follow, and MUST forget the ones it reported only
  // once the Ping carrying them has left. Empty means the client
  // predates this field or has nothing to report, and then the Node
  // MUST record no gesture at all.
  repeated Gesture gestures = 5;
}
