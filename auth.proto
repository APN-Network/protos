syntax = "proto3";
package proto;

// Auth is sent by the client to the Node as the first application
// message after the TLS handshake. The Node verifies the HMAC tag
// against its current (and previous) pre-shared key and uses the
// recovered identity to set up the tunnel session.
message Auth {
  // Stable client identifier, exactly nine raw UTF-8 bytes; signed
  // by the HMAC together with timestamp. Not a UUID — the client
  // generates it once per installation using a cryptographically
  // secure RNG and persists it across launches.
  bytes client_id = 1;

  // Minutes since the project epoch (2024-01-01 UTC), bounding how
  // stale the frame may be. The Node accepts the message only if
  // this value is within one minute of its own clock; on its own it
  // does not prevent a replay inside that window, which is what the
  // nonce is for.
  uint32 timestamp = 2;

  // Truncated HMAC-SHA256 (12 bytes) over (client_id || timestamp ||
  // nonce), with the nonce omitted when it is empty, computed with
  // the pre-shared key issued to this client. Proves possession of
  // the PSK without revealing it. Receivers MUST assert
  // len(hmac) == 12 and reject the Auth before performing any
  // comparison; a shorter or absent value weakens authentication
  // non-deterministically across implementations. Implementations
  // MUST also verify client_id is exactly 9 bytes before computing
  // or checking this tag.
  bytes hmac = 3;

  // Free-form device label reported by the client (e.g. "SM-G998B",
  // "Pixel 8"). Recorded by the Hub for usage analytics; not used
  // for authentication.
  string device = 4;

  // Client locale tag (BCP-47, e.g. "en-US"), passed through to the
  // Hub for analytics and for localised server-side notifications.
  string locale = 5;

  // Random bytes appended so that the encrypted message size varies
  // across sessions. Defeats traffic-analysis fingerprinting of the
  // Auth frame; the Node ignores the contents. MUST NOT exceed 1024
  // bytes. The Node SHOULD enforce this ceiling as a raw-wire length
  // check before deserialising the message, so that an unauthenticated
  // peer cannot force a large pre-HMAC allocation.
  bytes padding = 6;

  // Version of the APN client software sending the request, in the
  // form "<store>:<semver>", where the store is a single letter
  // naming the marketplace the build was released to: "G" for Google
  // Play, "H" for Huawei AppGallery (e.g. "G:1.1.1" or "H:1.1.1").
  // Forwarded by the Node to the Hub for usage analytics; not used
  // for authentication.
  string version = 7;

  // Screen dimension of the client device in physical pixels, in the
  // form "<width>x<height>" (e.g. "1440x3120"). Forwarded by the Node
  // to the Hub for usage analytics; not used for authentication.
  string screen = 8;

  // Acquisition channel of this installation, as named by the store
  // that delivered the app (e.g. "hub" recovered from utm_source in a
  // Google Play install referrer). Empty when the install was organic
  // or when the store exposes no referrer, so receivers MUST treat an
  // absent value as normal and never reject the Auth for it.
  // Forwarded by the Node to the Hub for acquisition analytics; not
  // used for authentication. MUST NOT exceed 64 bytes; the Node
  // truncates anything longer.
  string campaign = 9;

  // Twelve random bytes, drawn afresh for every Auth frame and signed
  // by the HMAC together with client_id and timestamp. The Node keeps
  // the values it has seen lately and rejects a repeat, so a captured
  // frame cannot be replayed while its timestamp is still inside the
  // window. Empty means the client signs (client_id || timestamp)
  // alone, as older builds do; the Node then falls back to the
  // timestamp window and accepts the frame.
  bytes nonce = 10;
}
