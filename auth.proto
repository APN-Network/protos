syntax = "proto3";
package proto;

// Auth is sent by the client to the Node as the first application
// message after the TLS handshake. The Node verifies the HMAC tag
// against its current (and previous) pre-shared key and uses the
// recovered identity to set up the tunnel session.
message Auth {
  // Stable client identifier, exactly nine raw UTF-8 bytes; signed
  // by the HMAC together with timestamp. Not a UUID — the client
  // generates it once per installation using a cryptographically
  // secure RNG and persists it across launches.
  bytes client_id = 1;

  // Minutes since the project epoch (2024-01-01 UTC), bounding how
  // stale the frame may be. The Node accepts the message only if
  // this value is within one minute of its own clock; on its own it
  // does not prevent a replay inside that window, which is what the
  // nonce is for.
  uint32 timestamp = 2;

  // Truncated HMAC-SHA256 (12 bytes) over (client_id || timestamp ||
  // nonce), with the nonce omitted when it is empty, computed with
  // the pre-shared key issued to this client. The input is a raw
  // byte string, not a serialised message: nine bytes of client_id,
  // then the three low-order bytes of timestamp in big-endian
  // order, then the twelve bytes of nonce when it is present. That
  // is twelve bytes signed without a nonce and twenty-four with
  // one. Proves possession of the PSK without revealing it.
  // Receivers MUST assert len(hmac) == 12 and reject the Auth
  // before performing any comparison; a shorter or absent value
  // weakens authentication non-deterministically across
  // implementations. Implementations MUST also verify client_id is
  // exactly 9 bytes before computing or checking this tag.
  bytes hmac = 3;

  // Free-form device label reported by the client (e.g. "SM-G998B",
  // "Pixel 8"). Recorded by the Hub for usage analytics; not used
  // for authentication.
  string device = 4;

  // Client locale tag (BCP-47, e.g. "en-US"), passed through to the
  // Hub for analytics and for localised server-side notifications.
  string locale = 5;

  // Random bytes appended so that the encrypted message size varies
  // across sessions. Defeats traffic-analysis fingerprinting of the
  // Auth frame; the Node ignores the contents. MUST NOT exceed 1024
  // bytes. The Node SHOULD enforce this ceiling as a raw-wire length
  // check before deserialising the message, so that an unauthenticated
  // peer cannot force a large pre-HMAC allocation.
  bytes padding = 6;

  // Version of the APN client software sending the request, in the
  // form "<store>:<semver>", where the store is a single letter
  // naming the marketplace the build was released to: "A" for the
  // Apple App Store, "G" for Google Play, "H" for Huawei AppGallery
  // and "W" for the Microsoft Store (e.g. "A:1.1.1" or "G:1.1.1").
  // Forwarded by the Node to the Hub for usage analytics; not used
  // for authentication.
  string version = 7;

  // Screen dimension of the client device in physical pixels, in the
  // form "<width>x<height>" (e.g. "1440x3120"). Forwarded by the Node
  // to the Hub for usage analytics; not used for authentication.
  string screen = 8;

  // Acquisition channel of this installation, as named by the store
  // that delivered the app (e.g. "hub" recovered from utm_source in a
  // Google Play install referrer). Empty when the install was organic
  // or when the store exposes no referrer, so receivers MUST treat an
  // absent value as normal and never reject the Auth for it.
  // Forwarded by the Node to the Hub for acquisition analytics; not
  // used for authentication. MUST NOT exceed 64 bytes; the Node
  // truncates anything longer.
  string campaign = 9;

  // Twelve random bytes, drawn afresh for every Auth frame and signed
  // by the HMAC together with client_id and timestamp. The Node keeps
  // the values it has seen lately and rejects a repeat, so a captured
  // frame cannot be replayed while its timestamp is still inside the
  // window. Empty means the client signs (client_id || timestamp)
  // alone, as older builds do; the Node then falls back to the
  // timestamp window and accepts the frame.
  bytes nonce = 10;
  // Proof from the platform that this frame comes from our genuine,
  // store-signed app, so that a repackaged copy cannot claim a free
  // trial under a client_id it made up. Absent when the platform
  // offers no such proof or the client failed to obtain one; the
  // Node MUST accept the frame anyway and leave the decision to the
  // Hub.
  Voucher voucher = 11;
}

// Voucher carries one platform attestation. Apple vouchers are bound
// to the Auth frame they travel in: the client computes the binding
// as SHA-256 over the exact bytes the HMAC signs (client_id ||
// timestamp || nonce), so such a voucher is worthless under another
// client_id or after the nonce has been seen. Google Play and Huawei
// vouchers are slow to obtain, so the client fetches one per install
// and keeps it; they are bound to client_id alone, through SHA-256
// over its ASCII bytes. The Node does not interpret the voucher; it
// forwards kind, blob and the frame digest to the Hub, which
// verifies them offline. A serialised Voucher MUST NOT
// exceed 8192 bytes; the Node SHOULD enforce this as a raw-wire
// length check, as it does for Auth.padding.
message Voucher {
  // Format of the blob: "play" is a classic Google Play Integrity
  // token whose nonce is the URL-safe Base64, without padding, of
  // SHA-256 over client_id; "huawei" is a Huawei Safety Detect
  // SysIntegrity JWS whose nonce is that same SHA-256, in raw bytes;
  // "attest" is an Apple App Attest attestation object whose
  // clientDataHash is the frame digest, sent until the Hub has
  // recorded the key; "assert" is an App Attest assertion over the
  // frame digest, made with that recorded key. Receivers MUST treat
  // an unknown kind as an absent voucher.
  string kind = 1;
  // The platform's attestation, opaque to everyone but the Hub.
  // For "attest" and "assert" the App Attest key identifier is not
  // included separately; the Hub finds the key by client_id.
  bytes blob = 2;
}
